<form method="post" action="/app/createCourse">
    <input type="text" name="course-name">

    <input type="time" name="start-time">
    <input type="time" name="end-time">

    <input type="checkbox" name="day-mon"> Monday
    <input type="checkbox" name="day-tue"> Tuesday
    <input type="checkbox" name="day-wed"> Wednesday
    <input type="checkbox" name="day-thu"> Thursday
    <input type="checkbox" name="day-fri"> Friday

    <button type="submit">Create Course</button>
</form>
